<!DOCTYPE html>
<html>
<head>
    <title>Clebsch Diagonal Surface</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: monospace; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #ccc;
            background: rgba(0,0,0,0.7); padding: 12px; border-radius: 4px;
            font-size: 13px; line-height: 1.6; max-width: 320px;
        }
        #info h2 { margin: 0 0 8px 0; color: #8af; font-size: 15px; }
        #controls {
            position: absolute; bottom: 10px; left: 10px; color: #ccc;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 4px;
            font-size: 12px;
        }
        #controls label { display: block; margin: 4px 0; }
        #controls input[type="range"] { width: 120px; vertical-align: middle; }
        #controls input[type="checkbox"] { vertical-align: middle; }
    </style>
</head>
<body>
<div id="info">
    <h2>Clebsch Diagonal Surface</h2>
    <div>The cubic surface with S&#x2085; symmetry.<br>
    All 27 lines are real (24 visible).<br>
    10 Eckardt points (3 lines meet).<br>
    <br>
    Equation in P&#x2074;:<br>
    &Sigma;x&#x1d62; = 0, &Sigma;x&#x1d62;&sup3; = 0<br>
    <br>
    <span style="color:#ff4">&#x2014;</span> 15 lines (Type I, pair partitions)<br>
    <span style="color:#4ff">&#x2014;</span> 12 lines (Type II, 5-cycles)
    </div>
</div>
<div id="controls">
    <label><input type="checkbox" id="showLines" checked> Show 27 lines</label>
    <label>Clip: <input type="range" id="clipDist" min="0.5" max="5.0" step="0.1" value="2.2"></label>
    <label>Rotate: <input type="range" id="rotSpeed" min="0" max="1.0" step="0.05" value="0.3"></label>
</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const vsSource = `#version 300 es
in vec2 pos;
void main() { gl_Position = vec4(pos, 0.0, 1.0); }
`;

const fsSource = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
uniform float uClip;
uniform float uRotSpeed;
uniform bool uShowLines;
uniform mat3 uView;
out vec4 fragColor;

float clebsch(vec3 p) {
    float s = p.x + p.y + p.z + 1.0;
    return p.x*p.x*p.x + p.y*p.y*p.y + p.z*p.z*p.z + 1.0 - s*s*s;
}

vec3 clebschNormal(vec3 p) {
    float s = p.x + p.y + p.z + 1.0;
    return normalize(vec3(
        3.0*p.x*p.x - 3.0*s*s,
        3.0*p.y*p.y - 3.0*s*s,
        3.0*p.z*p.z - 3.0*s*s
    ));
}

float trace(vec3 ro, vec3 rd, out vec3 hitPos, out vec3 hitNorm) {
    float t = 0.0;
    float prev = clebsch(ro);
    float dt = 0.02;
    float tMax = 10.0;

    for (int i = 0; i < 500; i++) {
        t += dt;
        if (t > tMax) return -1.0;
        vec3 p = ro + rd * t;
        if (length(p) > uClip) { prev = clebsch(p); continue; }
        float val = clebsch(p);
        if (prev * val < 0.0) {
            float lo = t - dt, hi = t;
            for (int j = 0; j < 20; j++) {
                float mid = (lo + hi) * 0.5;
                vec3 mp = ro + rd * mid;
                float mv = clebsch(mp);
                if (prev * mv < 0.0) hi = mid;
                else { lo = mid; prev = mv; }
            }
            hitPos = ro + rd * (lo + hi) * 0.5;
            hitNorm = clebschNormal(hitPos);
            return (lo + hi) * 0.5;
        }
        prev = val;
    }
    return -1.0;
}

// Distance from point to infinite line through a and b
float distToLine(vec3 p, vec3 a, vec3 b) {
    vec3 ab = b - a;
    float t = dot(p - a, ab) / dot(ab, ab); // no clamping = infinite line
    return length(p - a - t * ab);
}

// 24 visible lines (stored as endpoints, shifted by center)
// Type I (15, but 3 at infinity): 12 visible
// Type II (12): all 12 visible
const int N_LINES = 24;
const int TYPE_I_COUNT = 12; // first 12 are Type I

// Line endpoints (pre-shifted by center = -0.33, -0.33, -0.33)
vec3 lineA[24];
vec3 lineB[24];

void initLines() {
    // Type I lines (pair partition family) - yellow
    lineA[0]=vec3(0.0,-0.01,0.01); lineB[0]=vec3(0.0,-2.438,2.438);
    lineA[1]=vec3(0.0,-1.0,-3.225); lineB[1]=vec3(0.0,-1.0,-0.01);
    lineA[2]=vec3(0.0,-3.225,-1.0); lineB[2]=vec3(0.0,-0.01,-1.0);
    lineA[3]=vec3(-0.01,0.0,0.01); lineB[3]=vec3(-2.438,0.0,2.438);
    lineA[4]=vec3(-1.0,0.0,-3.225); lineB[4]=vec3(-1.0,0.0,-0.01);
    lineA[5]=vec3(-3.225,0.0,-1.0); lineB[5]=vec3(-0.01,0.0,-1.0);
    lineA[6]=vec3(-0.01,0.01,0.0); lineB[6]=vec3(-2.438,2.438,0.0);
    lineA[7]=vec3(-1.0,-3.225,0.0); lineB[7]=vec3(-1.0,-0.01,0.0);
    lineA[8]=vec3(-3.225,-1.0,0.0); lineB[8]=vec3(-0.01,-1.0,0.0);
    lineA[9]=vec3(0.01,-0.01,-1.0); lineB[9]=vec3(2.173,-2.173,-1.0);
    lineA[10]=vec3(0.01,-1.0,-0.01); lineB[10]=vec3(2.173,-1.0,-2.173);
    lineA[11]=vec3(-1.0,0.01,-0.01); lineB[11]=vec3(-1.0,2.173,-2.173);
    // Type II lines (5-cycle family) - cyan
    lineA[12]=vec3(-1.227,-0.367,-0.391); lineB[12]=vec3(0.524,2.466,-2.142);
    lineA[13]=vec3(0.715,-2.158,-2.333); lineB[13]=vec3(-1.227,0.985,-0.391);
    lineA[14]=vec3(0.524,2.466,-1.848); lineB[14]=vec3(-1.227,-0.367,0.985);
    lineA[15]=vec3(-1.227,-0.391,0.985); lineB[15]=vec3(0.715,-2.333,-2.158);
    lineA[16]=vec3(-1.227,-0.391,-0.367); lineB[16]=vec3(0.524,-2.142,2.466);
    lineA[17]=vec3(0.011,0.608,-0.625); lineB[17]=vec3(2.285,-1.667,-2.030);
    lineA[18]=vec3(2.564,0.584,-1.946); lineB[18]=vec3(0.011,-0.994,0.608);
    lineA[19]=vec3(0.011,0.608,-0.994); lineB[19]=vec3(2.564,-1.946,0.584);
    lineA[20]=vec3(2.564,0.584,-2.202); lineB[20]=vec3(0.011,-0.994,-0.625);
    lineA[21]=vec3(2.564,-2.202,0.584); lineB[21]=vec3(0.011,-0.625,-0.994);
    lineA[22]=vec3(-1.227,0.985,-0.367); lineB[22]=vec3(0.524,-1.848,2.466);
    lineA[23]=vec3(0.011,-0.625,0.608); lineB[23]=vec3(2.285,-2.030,-1.667);
}

void main() {
    initLines();

    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;

    float angle = uTime * uRotSpeed;
    mat3 rot = mat3(
        cos(angle), 0.0, sin(angle),
        0.0, 1.0, 0.0,
        -sin(angle), 0.0, cos(angle)
    );

    float tilt = 0.4;
    mat3 tiltM = mat3(
        1.0, 0.0, 0.0,
        0.0, cos(tilt), -sin(tilt),
        0.0, sin(tilt), cos(tilt)
    );

    mat3 view = tiltM * rot * uView;

    vec3 ro = view * vec3(0.0, 0.0, -9.0);
    vec3 rd = normalize(view * vec3(uv, 2.8));

    vec3 center = vec3(-0.33, -0.33, -0.33);
    ro -= center;

    vec3 hitPos, hitNorm;
    float t = trace(ro, rd, hitPos, hitNorm);

    vec3 col = vec3(0.05, 0.05, 0.12);

    if (t > 0.0) {
        vec3 lightDir = normalize(vec3(1.0, 2.0, -1.0));
        vec3 lightDir2 = normalize(vec3(-1.0, -0.5, -2.0));

        float diff = max(dot(hitNorm, lightDir), 0.0);
        float diff3 = max(dot(hitNorm, lightDir2), 0.0) * 0.3;

        float facing = dot(hitNorm, -rd);
        vec3 frontCol = vec3(0.2, 0.5, 0.9);
        vec3 backCol = vec3(0.9, 0.3, 0.2);
        vec3 surfCol = facing > 0.0 ? frontCol : backCol;

        float fresnel = pow(1.0 - abs(facing), 3.0);
        col = surfCol * (diff + diff3 + 0.15) + vec3(0.8) * fresnel * 0.3;

        vec3 refl = reflect(rd, hitNorm);
        float spec = pow(max(dot(refl, lightDir), 0.0), 32.0);
        col += vec3(1.0) * spec * 0.4;

        // Draw lines on the surface
        if (uShowLines) {
            float lineWidth = 0.06;
            float minDist = 100.0;
            int closest = -1;
            vec3 surfPt = hitPos; // hitPos is already in original affine coords

            for (int i = 0; i < N_LINES; i++) {
                float d = distToLine(surfPt, lineA[i], lineB[i]);
                if (d < minDist) { minDist = d; closest = i; }
            }

            if (minDist < lineWidth) {
                float blend = smoothstep(lineWidth, lineWidth * 0.3, minDist);
                vec3 lineCol = closest < TYPE_I_COUNT
                    ? vec3(1.0, 0.9, 0.2)   // yellow for Type I
                    : vec3(0.2, 1.0, 1.0);   // cyan for Type II
                col = mix(col, lineCol, blend * 0.9);
            }
        }
    }

    col = pow(col, vec3(1.0/2.2));
    fragColor = vec4(col, 1.0);
}
`;

function createShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        return null;
    }
    return shader;
}

const vs = createShader(gl.VERTEX_SHADER, vsSource);
const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
}
gl.useProgram(program);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(program, 'pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');
const uClip = gl.getUniformLocation(program, 'uClip');
const uRotSpeed = gl.getUniformLocation(program, 'uRotSpeed');
const uShowLines = gl.getUniformLocation(program, 'uShowLines');
const uView = gl.getUniformLocation(program, 'uView');

let viewMat = [1,0,0, 0,1,0, 0,0,1];
let dragging = false, lastX = 0, lastY = 0;
let rotX = 0, rotY = 0;

canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mousemove', e => {
    if (!dragging) return;
    rotY += (e.clientX - lastX) * 0.005;
    rotX += (e.clientY - lastY) * 0.005;
    lastX = e.clientX; lastY = e.clientY;
    updateViewMat();
});

function updateViewMat() {
    const cx = Math.cos(rotX), sx = Math.sin(rotX);
    const cy = Math.cos(rotY), sy = Math.sin(rotY);
    viewMat = [
        cy, 0, sy,
        sx*sy, cx, -sx*cy,
        -cx*sy, sx, cx*cy
    ];
}

let startTime = Date.now();

function render() {
    const t = (Date.now() - startTime) / 1000.0;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, t);
    gl.uniform1f(uClip, parseFloat(document.getElementById('clipDist').value));
    gl.uniform1f(uRotSpeed, parseFloat(document.getElementById('rotSpeed').value));
    gl.uniform1i(uShowLines, document.getElementById('showLines').checked ? 1 : 0);
    gl.uniformMatrix3fv(uView, false, viewMat);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
