name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run pure-Python unit tests
        run: pytest tests/ -v

      - name: Smoke-import core modules
        run: |
          python -c "from src.draw_graph import segments_cross, count_all_crossings, score_quotient"
          echo "All core modules importable"
