<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Folding a Square into a Torus</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#08080c; overflow:hidden; font-family:'Courier New',monospace; }
canvas { display:block; }
#info { position:absolute; top:12px; left:16px; color:#8899aa; font-size:13px; line-height:1.6; pointer-events:none; }
#info h2 { color:#ccd0d8; font-size:16px; margin-bottom:4px; font-weight:normal; }
#controls { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#8899aa; font-size:12px; text-align:center; }
#controls input[type=range] { width:300px; cursor:pointer; }
#phase { color:#e8b84d; font-size:13px; margin-top:4px; }
#playBtn { background:none; border:1px solid #667788; color:#ccd0d8; padding:4px 16px;
  cursor:pointer; font-family:inherit; font-size:13px; border-radius:3px; margin-right:12px; }
#playBtn:hover { border-color:#99aabb; }
</style>
</head><body>

<div id="info">
  <h2>Folding a Square into a Torus</h2>
  <span id="stageLabel">Flat square</span>
</div>

<div id="controls">
  <input type="range" id="slider" min="0" max="1000" value="0">
  <div id="phase">t = 0.00 — drag to fold</div>
  <button id="playBtn">&#9654; Play</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080c);
const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
cam.position.set(5, 3, 5);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setSize(innerWidth, innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(ren.domElement);
const ctl = new OrbitControls(cam, ren.domElement);
ctl.enableDamping = true; ctl.dampingFactor = 0.05;

scene.add(new THREE.AmbientLight(0x556677, 0.6));
let l;
l = new THREE.DirectionalLight(0xffeedd, 1.2); l.position.set(5,8,5); scene.add(l);
l = new THREE.DirectionalLight(0x99aacc, 0.5); l.position.set(-4,2,-3); scene.add(l);
l = new THREE.DirectionalLight(0xaabbdd, 0.3); l.position.set(0,-5,5); scene.add(l);

// Torus parameters
const R = 1.3;  // major radius
const r = 0.5;  // minor radius

// Grid resolution
const N = 32;

// Create mesh (N×N quads = 2N² triangles)
const positions = new Float32Array((N+1)*(N+1)*3);
const normals = new Float32Array((N+1)*(N+1)*3);
const indices = [];
const uvs = new Float32Array((N+1)*(N+1)*2);

for (let j = 0; j <= N; j++) {
  for (let i = 0; i <= N; i++) {
    const idx = j*(N+1)+i;
    uvs[idx*2] = i/N;
    uvs[idx*2+1] = j/N;
  }
}
for (let j = 0; j < N; j++) {
  for (let i = 0; i < N; i++) {
    const a = j*(N+1)+i, b = a+1, c = (j+1)*(N+1)+i, d = c+1;
    indices.push(a,c,b, b,c,d);
  }
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
geo.setIndex(indices);

const mat = new THREE.MeshPhongMaterial({
  color: 0x5a6a80, side: THREE.DoubleSide, shininess: 25,
  transparent: true, opacity: 0.85
});
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

// Grid lines (u-constant and v-constant)
const NGRID = 8;
const gridLines = [];

function makeGridLine() {
  const pts = new Float32Array(129 * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  return { geo, pts };
}

// u-constant lines (vertical on square → meridians on torus)
for (let i = 0; i <= NGRID; i++) {
  const gl = makeGridLine();
  const line = new THREE.Line(gl.geo, new THREE.LineBasicMaterial({
    color: 0x334455, transparent: true, opacity: 0.6
  }));
  gridLines.push({ ...gl, type: 'u', param: i/NGRID, line });
  scene.add(line);
}
// v-constant lines (horizontal on square → latitudes on torus)
for (let i = 0; i <= NGRID; i++) {
  const gl = makeGridLine();
  const line = new THREE.Line(gl.geo, new THREE.LineBasicMaterial({
    color: 0x334455, transparent: true, opacity: 0.6
  }));
  gridLines.push({ ...gl, type: 'v', param: i/NGRID, line });
  scene.add(line);
}

// The two special loops
function makeLoop(npts) {
  const pts = new Float32Array(npts * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  return { geo, pts };
}

// a-loop (bottom/top edge: y=0 or y=1, x varies) → blue
const aLoop = makeLoop(129);
const aLoopMesh = new THREE.Line(aLoop.geo, new THREE.LineBasicMaterial({ color: 0x4488ff, linewidth: 2 }));
scene.add(aLoopMesh);

// b-loop (left/right edge: x=0 or x=1, y varies) → red
const bLoop = makeLoop(129);
const bLoopMesh = new THREE.Line(bLoop.geo, new THREE.LineBasicMaterial({ color: 0xff6644, linewidth: 2 }));
scene.add(bLoopMesh);

// Thick tube versions of loops
let aTube, bTube;

// ── Fold computation ──

const FLAT_SCALE = 2.5;  // size of the flat square

function computePoint(xn, yn, t) {
  // xn, yn ∈ [0, 1]
  const fy = (yn - 0.5) * FLAT_SCALE;

  if (t <= 0.5) {
    // Phase 1: flat → cylinder (progressive bend in x)
    // At s=0: flat sheet. At s=1: full cylinder.
    // Bend angle increases from 0 to 2π.
    const s = smoothstep(t * 2);
    const angle = s * 2 * Math.PI * xn;
    // The "unbent" length maps to an arc: radius shrinks from ∞ (flat) to R
    // Use: at bend s, the sheet curves with radius that gives arc length = FLAT_SCALE
    // For partial bend: radius = FLAT_SCALE / (s * 2π), but clamp for s→0
    if (s < 0.001) {
      return [(xn - 0.5) * FLAT_SCALE, fy, 0];
    }
    const bendR = FLAT_SCALE / (s * 2 * Math.PI);
    const x = bendR * Math.sin(angle);
    const z = bendR * (1 - Math.cos(angle));
    // Center the shape: at s=1, bendR=R and the cylinder is centered
    const cx = -bendR * Math.sin(s * Math.PI);  // shift so it stays centered
    const cz = -bendR * (1 - Math.cos(s * Math.PI));
    return [x + cx, fy, z + cz];
  } else {
    // Phase 2: cylinder → torus (progressive bend in y)
    // The cylinder axis is along y. We bend it into a ring.
    const s = smoothstep((t - 0.5) * 2);
    const u = 2 * Math.PI * xn;

    if (s < 0.001) {
      // Pure cylinder
      return [R * Math.cos(u), fy, R * Math.sin(u)];
    }

    // Bend the cylinder: the y-axis curves into a circle of radius bendR
    const bendAngle = s * 2 * Math.PI * yn;
    const bendR = FLAT_SCALE / (s * 2 * Math.PI);
    // Position along the bent axis
    const axisX = bendR * Math.sin(bendAngle);
    const axisY = bendR * (1 - Math.cos(bendAngle));
    // Center
    const cax = -bendR * Math.sin(s * Math.PI);
    const cay = -bendR * (1 - Math.cos(s * Math.PI));
    // The tube cross-section: at this point along the axis, the local
    // "outward" direction is the tangent rotated 90° = (cos(bendAngle), sin(bendAngle)) in the bend plane
    const outX = Math.cos(bendAngle);  // radial direction in bend plane
    const outY = Math.sin(bendAngle);
    // The tube offset: r * cos(v) in the outward direction, r * sin(v) perpendicular to bend plane
    // At s=0: outward = (0, 1, 0) rotated... we need to be careful about which plane we bend in.
    // The cylinder axis is along y. We bend it so y curves into the x-y plane.
    // Local frame: tangent = d/d(bendAngle), normal = toward center, binormal = along cylinder cross-section
    const tubeR = lerp(r, r, 1); // tube radius stays constant
    // Cross-section angle
    const v = 2 * Math.PI * yn;
    // In the cylinder, cross-section is in the x-z plane at angle u
    // On the torus, cross-section is tube angle v in (radial, axisPerp) plane
    // Interpolate: the cross-section circle defined by u stays, but gets modulated
    const cylX = R * Math.cos(u);
    const cylZ = R * Math.sin(u);

    // Simpler approach: interpolate the MAJOR radius from ∞ (straight) to R_major
    // At parameter s, major radius = FLAT_SCALE / (s * 2π)
    // The tube center traces a circle of this radius in the x-y plane
    const majorR = bendR;
    // Tube center position
    const tcx = (majorR + cax) + 0; // need to think about this differently...

    // Let me use a cleaner formulation:
    // The cylinder has its axis along y, with tube cross-section radius R in x-z.
    // We want to bend the y-axis into a circle of radius majorR in the x-y plane.
    // Each point on the cylinder: (R*cos(u), y, R*sin(u))
    // After bending y into angle φ = y/majorR on a circle of radius majorR:
    //   center of cross-section: ((majorR + R*cos(u)) * cos(φ), (majorR + R*cos(u)) * sin(φ) ... no

    // Actually: the cylinder point (R*cos(u), y, R*sin(u))
    // Bending y around a circle: y → angle φ, with R_bend = majorR
    // The cross-section at position y moves to angle φ = y / majorR (arc length)
    // Wait, I should parameterize by yn not y.

    // phi = s * 2π * yn = bendAngle (how far around the bend)
    const phi = bendAngle;
    // At this angle, the center of the cross-section is at:
    // (majorR * sin(phi) + cax, majorR*(1-cos(phi)) + cay, 0) — bending in x-y plane
    // But we want to bend in the plane that keeps z unchanged...
    // Actually the torus major circle should be in x-z, matching the final torus orientation.

    // Let me just do it right:
    // Final torus: major circle in x-z, tube in the radial-y plane
    // (R + r*cos(v)) * cos(u), r*sin(v), (R + r*cos(v)) * sin(u)

    // Progressive bend: replace the straight cylinder axis (along y) with a circular arc in x-y
    // No wait... the cylinder already has its major circle in x-z (from phase 1).
    // Phase 2 bends the y-axis into the tube circle.

    // Cylinder point: (R*cos(u), fy, R*sin(u)) where fy = (yn-0.5)*FLAT_SCALE
    // We want to bend fy into angle v = 2π*yn on a tube of radius r
    // The tube center is at (R*cos(u), 0, R*sin(u))
    // The tube direction at angle v: radially outward * cos(v) + y * sin(v)
    // Radially outward = (cos(u), 0, sin(u))

    // Progressive bend: tube radius = FLAT_SCALE / (s * 2π)
    const tubeR2 = FLAT_SCALE / (s * 2 * Math.PI);
    const bendV = s * 2 * Math.PI * yn;
    // Tube center offset from axis in the radial-y plane:
    const radialOffset = tubeR2 * (1 - Math.cos(bendV));
    const yOffset = tubeR2 * Math.sin(bendV);
    // Center the tube
    const cRad = -tubeR2 * (1 - Math.cos(s * Math.PI));
    const cY = -tubeR2 * Math.sin(s * Math.PI);

    const effR = R + radialOffset + cRad;
    return [
      effR * Math.cos(u),
      yOffset + cY,
      effR * Math.sin(u)
    ];
  }
}

function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(t) { return t * t * (3 - 2 * t); }

function updateGeometry(t) {
  const pos = geo.attributes.position.array;
  for (let j = 0; j <= N; j++) {
    for (let i = 0; i <= N; i++) {
      const idx = j*(N+1)+i;
      const [x, y, z] = computePoint(i/N, j/N, t);
      pos[idx*3] = x;
      pos[idx*3+1] = y;
      pos[idx*3+2] = z;
    }
  }
  geo.attributes.position.needsUpdate = true;
  geo.computeVertexNormals();

  // Update grid lines
  for (const gl of gridLines) {
    const npts = 129;
    for (let k = 0; k < npts; k++) {
      let xn, yn;
      if (gl.type === 'u') {
        xn = gl.param; yn = k/(npts-1);
      } else {
        xn = k/(npts-1); yn = gl.param;
      }
      const [x, y, z] = computePoint(xn, yn, t);
      gl.pts[k*3] = x; gl.pts[k*3+1] = y; gl.pts[k*3+2] = z;
    }
    gl.geo.attributes.position.needsUpdate = true;
  }

  // Update a-loop (y = 0, x varies)
  for (let k = 0; k < 129; k++) {
    const [x, y, z] = computePoint(k/128, 0, t);
    aLoop.pts[k*3] = x; aLoop.pts[k*3+1] = y; aLoop.pts[k*3+2] = z;
  }
  aLoop.geo.attributes.position.needsUpdate = true;

  // Update b-loop (x = 0, y varies)
  for (let k = 0; k < 129; k++) {
    const [x, y, z] = computePoint(0, k/128, t);
    bLoop.pts[k*3] = x; bLoop.pts[k*3+1] = y; bLoop.pts[k*3+2] = z;
  }
  bLoop.geo.attributes.position.needsUpdate = true;

  // Stage label
  const label = document.getElementById('stageLabel');
  if (t < 0.01) label.textContent = 'Flat square';
  else if (t < 0.48) label.textContent = 'Rolling into cylinder (identifying a ↔ a⁻¹)';
  else if (t < 0.52) label.textContent = 'Cylinder';
  else if (t < 0.99) label.textContent = 'Bending into torus (identifying b ↔ b⁻¹)';
  else label.textContent = 'Torus — two loops from four edges';
}

// Initialize at t=0
updateGeometry(0);

// Slider
const slider = document.getElementById('slider');
const phaseEl = document.getElementById('phase');
const playBtn = document.getElementById('playBtn');
let currentT = 0;
let autoTime = 0;
let playing = false;

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.innerHTML = playing ? '&#9646;&#9646; Pause' : '&#9654; Play';
  if (playing) autoTime = currentT;
});

slider.addEventListener('input', () => {
  currentT = slider.value / 1000;
  playing = false;
  playBtn.innerHTML = '&#9654; Play';
  updateGeometry(currentT);
  phaseEl.textContent = `t = ${currentT.toFixed(2)}`;
});

window.addEventListener('resize', () => {
  cam.aspect = innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);

  if (playing) {
    autoTime += 0.003;
    // Oscillate: 0→1→pause→1→0→pause
    const cycle = autoTime % 4;
    if (cycle < 1) currentT = cycle;
    else if (cycle < 1.5) currentT = 1;
    else if (cycle < 2.5) currentT = 1 - (cycle - 1.5);
    else if (cycle < 3) currentT = 0;
    else currentT = 0;

    slider.value = currentT * 1000;
    phaseEl.textContent = `t = ${currentT.toFixed(2)}`;
    updateGeometry(currentT);
  }

  ctl.update();
  ren.render(scene, cam);
})();
</script>
</body></html>
